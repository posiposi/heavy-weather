name: heavy-weather

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4.10
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysql -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1" "$$MYSQL_DATABASE"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  go-mod-cache:
  go-build-cache:
  db-data:
